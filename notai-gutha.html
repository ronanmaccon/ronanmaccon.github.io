<!DOCTYPE html>
<html lang="ga">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Nótaí Gutha">
<meta name="theme-color" content="#0E4D43">
<title>Nótaí Gutha</title>
<link rel="apple-touch-icon" sizes="180x180" href="icon-180.png">
<link rel="icon" type="image/png" sizes="180x180" href="icon-180.png">
<style>
  :root{
    --paper:#FAF8F4;
    --ink:#21302B;
    --ink-soft:#5C6B65;
    --green:#0E4D43;
    --green-deep:#0A3A33;
    --gold:#A38F5F;
    --red:#B4432F;
    --line:#E4DFD4;
    --card:#FFFFFF;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;height:100%}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    display:flex;flex-direction:column;
    height:100dvh;
    overflow:hidden;
  }
  header{
    padding:calc(env(safe-area-inset-top) + 10px) 18px 10px;
    display:flex;align-items:baseline;justify-content:space-between;
    border-bottom:1px solid var(--line);
    background:var(--paper);
  }
  header h1{
    font-family:ui-serif,"New York",Georgia,serif;
    font-size:1.35rem;font-weight:600;margin:0;color:var(--green);
    letter-spacing:.01em;
  }
  header .sub{font-size:.72rem;color:var(--ink-soft);letter-spacing:.04em}
  header .sub a{color:var(--gold);text-decoration:none;font-weight:600}

  /* ---------- Views ---------- */
  .view{flex:1;display:flex;flex-direction:column;min-height:0}
  .hidden{display:none !important}

  /* ---------- Notes list ---------- */
  #listView .scroll{flex:1;overflow-y:auto;padding:12px 16px 90px;-webkit-overflow-scrolling:touch}
  .note-card{
    background:var(--card);border:1px solid var(--line);border-radius:14px;
    padding:14px 16px;margin-bottom:10px;cursor:pointer;
  }
  .note-card h3{
    margin:0 0 4px;font-family:ui-serif,"New York",Georgia,serif;
    font-size:1.02rem;font-weight:600;color:var(--ink);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .note-card p{margin:0;font-size:.85rem;color:var(--ink-soft);
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .note-card time{font-size:.7rem;color:var(--gold);font-weight:600;letter-spacing:.05em;text-transform:uppercase}
  .empty{
    margin:60px 24px;text-align:center;color:var(--ink-soft);
    font-family:ui-serif,"New York",Georgia,serif;font-size:1.05rem;line-height:1.6;
  }
  .fab{
    position:fixed;right:20px;bottom:calc(env(safe-area-inset-bottom) + 20px);
    width:60px;height:60px;border-radius:50%;
    background:var(--green);color:#fff;border:none;font-size:1.9rem;line-height:0;
    box-shadow:0 6px 18px rgba(14,77,67,.35);cursor:pointer;
  }
  .fab:active{transform:scale(.94)}

  /* ---------- Editor ---------- */
  #editorView{background:var(--paper)}
  .toolbar{
    display:flex;align-items:center;gap:6px;
    padding:8px 12px;border-bottom:1px solid var(--line);
  }
  .toolbar .spacer{flex:1}
  .tbtn{
    background:none;border:none;color:var(--green);font-size:.9rem;font-weight:600;
    padding:8px 10px;border-radius:8px;cursor:pointer;font-family:inherit;
  }
  .tbtn:active{background:rgba(14,77,67,.08)}
  .tbtn.danger{color:var(--red)}
  #noteText{
    flex:1;width:100%;border:none;outline:none;resize:none;
    background:transparent;color:var(--ink);
    font-family:ui-serif,"New York",Georgia,serif;
    font-size:1.12rem;line-height:1.65;
    padding:16px 20px 12px;
  }
  #noteText::placeholder{color:#B9B2A2}

  /* interim words that just arrived */
  @keyframes settle{from{opacity:0;transform:translateY(3px)}to{opacity:1;transform:none}}

  /* ---------- Record dock ---------- */
  .dock{
    padding:10px 16px calc(env(safe-area-inset-bottom) + 14px);
    border-top:1px solid var(--line);
    display:flex;flex-direction:column;align-items:center;gap:8px;
    background:var(--paper);
  }
  #status{
    font-size:.78rem;color:var(--ink-soft);min-height:1.1em;
    letter-spacing:.03em;text-align:center;
  }
  #status.listening{color:var(--green);font-weight:600}
  #status.err{color:var(--red);font-weight:600}
  .mic-wrap{position:relative;width:78px;height:78px}
  #ring{
    position:absolute;inset:0;border-radius:50%;
    border:3px solid var(--gold);opacity:0;
    transition:transform .08s ease-out;
  }
  #micBtn{
    position:absolute;inset:7px;border-radius:50%;border:none;cursor:pointer;
    background:var(--green);color:#fff;
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 4px 14px rgba(14,77,67,.3);
    transition:background .2s;
  }
  #micBtn:active{transform:scale(.96)}
  #micBtn.rec{background:var(--red);box-shadow:0 4px 14px rgba(180,67,47,.35)}
  #micBtn svg{width:30px;height:30px}
  .hint{font-size:.72rem;color:var(--ink-soft)}

  .spin{
    width:14px;height:14px;border:2px solid var(--line);border-top-color:var(--gold);
    border-radius:50%;display:inline-block;vertical-align:-2px;margin-right:6px;
    animation:sp .8s linear infinite;
  }
  @keyframes sp{to{transform:rotate(360deg)}}
  @media (prefers-reduced-motion:reduce){
    .spin{animation:none}#ring{transition:none}
  }
</style>
</head>
<body>

<header>
  <h1 id="headerTitle">Nótaí Gutha</h1>
  <span class="sub">aithint cainte le <a href="https://abair.ie" target="_blank" rel="noopener">ABAIR</a></span>
</header>

<!-- ======== LIST VIEW ======== -->
<div class="view" id="listView">
  <div class="scroll" id="notesList"></div>
  <button class="fab" id="newNoteBtn" aria-label="Nóta nua">+</button>
</div>

<!-- ======== EDITOR VIEW ======== -->
<div class="view hidden" id="editorView">
  <div class="toolbar">
    <button class="tbtn" id="backBtn">&#8249; Nótaí</button>
    <div class="spacer"></div>
    <button class="tbtn" id="copyBtn">Cóipeáil</button>
    <button class="tbtn" id="shareBtn">Roinn</button>
    <button class="tbtn danger" id="deleteBtn">Scrios</button>
  </div>
  <textarea id="noteText" placeholder="Brúigh an micreafón agus labhair as Gaeilge…" spellcheck="false" autocapitalize="sentences"></textarea>
  <div class="dock">
    <div id="status"></div>
    <div class="mic-wrap">
      <div id="ring"></div>
      <button id="micBtn" aria-label="Tosaigh ag deachtú">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path d="M12 14a3 3 0 0 0 3-3V5a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3z"/>
          <path d="M19 11a7 7 0 0 1-14 0H3a9 9 0 0 0 8 8.94V22h2v-2.06A9 9 0 0 0 21 11h-2z"/>
        </svg>
      </button>
    </div>
    <div class="hint" id="hint">Brúigh chun tosú · brúigh arís chun stopadh</div>
  </div>
</div>

<script>
(function(){
"use strict";

/* =========================================================
   ABAIR recognition endpoint (v3-5, as used by abair.ie)
   POST multipart/form-data:
     file      = audio blob (server runs ffmpeg, WAV is fine)
     captpunct = "true"  -> capitalisation + punctuation
   Response: { "text": "...", "captpunct_applied": true }
   ========================================================= */
const ASR_URL = "https://recognition.abair.ie/v3-5/transcribe";
const MAX_CHUNK_SECONDS = 12;      // send before this length is reached
const SILENCE_HOLD_MS   = 1300;    // send after this much quiet
const RMS_SPEECH        = 0.015;   // level considered "speech"
const TARGET_RATE       = 16000;   // WAV sample rate sent to the recogniser

/* ---------------- Storage ---------------- */
const KEY = "notai-gutha-v1";
function loadNotes(){
  try{ return JSON.parse(localStorage.getItem(KEY)) || []; }catch(e){ return []; }
}
function saveNotes(){ try{ localStorage.setItem(KEY, JSON.stringify(notes)); }catch(e){} }
let notes = loadNotes();
let currentId = null;

/* ---------------- Elements ---------------- */
const $ = id => document.getElementById(id);
const listView = $("listView"), editorView = $("editorView");
const notesList = $("notesList"), noteText = $("noteText");
const micBtn = $("micBtn"), ring = $("ring"), statusEl = $("status"), hint = $("hint");

/* ---------------- Views ---------------- */
function fmtDate(ts){
  const d = new Date(ts);
  return d.toLocaleDateString("ga-IE",{day:"numeric",month:"short",year:"numeric"})
       + " · " + d.toLocaleTimeString("ga-IE",{hour:"2-digit",minute:"2-digit"});
}
function titleOf(n){
  const t = (n.text||"").trim().split(/\n/)[0].slice(0,60);
  return t || "Nóta gan teideal";
}
function renderList(){
  notesList.innerHTML = "";
  if(!notes.length){
    notesList.innerHTML = '<div class="empty">Níl aon nóta anseo fós.<br>Brúigh <strong>+</strong> agus abair leat.</div>';
    return;
  }
  notes.slice().sort((a,b)=>b.updated-a.updated).forEach(n=>{
    const card = document.createElement("div");
    card.className = "note-card";
    card.innerHTML = '<time>'+fmtDate(n.updated)+'</time><h3></h3><p></p>';
    card.querySelector("h3").textContent = titleOf(n);
    card.querySelector("p").textContent = (n.text||"").slice(0,160);
    card.onclick = ()=>openNote(n.id);
    notesList.appendChild(card);
  });
}
function openNote(id){
  currentId = id;
  const n = notes.find(x=>x.id===id);
  noteText.value = n ? n.text : "";
  listView.classList.add("hidden");
  editorView.classList.remove("hidden");
  setStatus("");
}
function backToList(){
  stopDictation();
  persistCurrent();
  editorView.classList.add("hidden");
  listView.classList.remove("hidden");
  renderList();
}
function persistCurrent(){
  const n = notes.find(x=>x.id===currentId);
  if(!n) return;
  if(n.text !== noteText.value){ n.text = noteText.value; n.updated = Date.now(); }
  saveNotes();
}
$("newNoteBtn").onclick = ()=>{
  const n = { id: Date.now().toString(36)+Math.random().toString(36).slice(2,6),
              text:"", created:Date.now(), updated:Date.now() };
  notes.push(n); saveNotes(); openNote(n.id);
  startDictation();          // + opens the note already listening
};
$("backBtn").onclick = backToList;
$("deleteBtn").onclick = ()=>{
  if(!confirm("An nóta seo a scriosadh?")) return;
  stopDictation();
  notes = notes.filter(x=>x.id!==currentId);
  saveNotes(); currentId=null;
  editorView.classList.add("hidden");
  listView.classList.remove("hidden");
  renderList();
};
$("copyBtn").onclick = async ()=>{
  persistCurrent();
  try{ await navigator.clipboard.writeText(noteText.value); setStatus("Cóipeáilte."); }
  catch(e){ setStatus("Níorbh fhéidir cóipeáil.", true); }
};
$("shareBtn").onclick = async ()=>{
  persistCurrent();
  const n = notes.find(x=>x.id===currentId);
  if(navigator.share){
    try{ await navigator.share({title:titleOf(n), text:noteText.value}); }catch(e){}
  }else{
    $("copyBtn").click();
  }
};
noteText.addEventListener("blur", persistCurrent);
window.addEventListener("pagehide", ()=>{ if(currentId) persistCurrent(); });

function setStatus(msg, isErr, listening){
  statusEl.className = isErr ? "err" : (listening ? "listening" : "");
  statusEl.innerHTML = msg;
}

/* =========================================================
   Audio capture: Web Audio -> 16 kHz mono 16-bit WAV chunks
   (MediaRecorder on iOS makes AAC, which the ASR does not
   want, so we build the WAV ourselves.)
   ========================================================= */
let audioCtx=null, stream=null, sourceNode=null, procNode=null;
let recording=false, sending=0;
let buf=[], bufSamples=0, srcRate=48000;
let hadSpeech=false, lastSpeechAt=0, chunkStartedAt=0;

function downsampleTo16k(f32, fromRate){
  if(fromRate===TARGET_RATE) return f32;
  const ratio = fromRate/TARGET_RATE;
  const outLen = Math.floor(f32.length/ratio);
  const out = new Float32Array(outLen);
  for(let i=0;i<outLen;i++){
    const start=Math.floor(i*ratio), end=Math.min(Math.floor((i+1)*ratio), f32.length);
    let sum=0, c=0;
    for(let j=start;j<end;j++){ sum+=f32[j]; c++; }
    out[i]= c? sum/c : 0;
  }
  return out;
}
function encodeWav(f32, rate){
  const len=f32.length;
  const ab=new ArrayBuffer(44+len*2);
  const v=new DataView(ab);
  function ws(o,s){ for(let i=0;i<s.length;i++) v.setUint8(o+i, s.charCodeAt(i)); }
  ws(0,"RIFF"); v.setUint32(4,36+len*2,true); ws(8,"WAVE");
  ws(12,"fmt "); v.setUint32(16,16,true); v.setUint16(20,1,true); v.setUint16(22,1,true);
  v.setUint32(24,rate,true); v.setUint32(28,rate*2,true); v.setUint16(32,2,true); v.setUint16(34,16,true);
  ws(36,"data"); v.setUint32(40,len*2,true);
  let off=44;
  for(let i=0;i<len;i++){
    let s=Math.max(-1,Math.min(1,f32[i]));
    v.setInt16(off, s<0 ? s*0x8000 : s*0x7FFF, true); off+=2;
  }
  return ab;
}
/* --------- pull transcription text out of the response --------- */
function extractText(data){
  if(!data) return "";
  if(typeof data === "string") return data.trim();
  for(const k of ["text","transcript","transcription","utterance"]){
    if(typeof data[k] === "string") return data[k].trim();
  }
  let t = data.transcriptions;
  if(typeof t === "string") return t.trim();
  if(Array.isArray(t) && t.length){
    const first = t[0];
    if(typeof first === "string") return first.trim();
    if(first && typeof first === "object"){
      for(const k of ["text","utterance","transcript","transcription"]){
        if(typeof first[k] === "string") return first[k].trim();
      }
    }
  }
  return "";
}

function appendToNote(text){
  if(!text) return;
  const cur = noteText.value;
  const needsSpace = cur.length && !/\s$/.test(cur);
  noteText.value = cur + (needsSpace ? " " : "") + text;
  noteText.scrollTop = noteText.scrollHeight;
  persistCurrent();
}

async function sendChunk(f32, rate){
  const mono16k = downsampleTo16k(f32, rate);
  // skip chunks that are effectively empty
  let energy=0;
  for(let i=0;i<mono16k.length;i+=50) energy=Math.max(energy, Math.abs(mono16k[i]));
  if(energy < RMS_SPEECH || mono16k.length < TARGET_RATE*0.4) return;

  const wavBlob = new Blob([encodeWav(mono16k, TARGET_RATE)], {type:"audio/wav"});
  const fd = new FormData();
  fd.append("file", wavBlob, "recording.wav");
  fd.append("captpunct", "true");

  sending++;
  updateBusy();
  try{
    const ctrl = new AbortController();
    const to = setTimeout(()=>ctrl.abort(), 30000);
    const res = await fetch(ASR_URL, { method:"POST", body: fd, signal: ctrl.signal });
    clearTimeout(to);
    if(!res.ok) throw new Error("freagra " + res.status + " ón bhfreastalaí");
    const data = await res.json();
    appendToNote(extractText(data));
  }catch(e){
    const why = e.name === "AbortError"
      ? "Bhí an freastalaí rómhall."
      : (e.message && e.message.indexOf("freagra") === 0
          ? "Theip ar Abair: " + e.message + "."
          : "Níorbh fhéidir teagmháil le seirbhís Abair.");
    setStatus(why + " Bain triail eile as.", true);
  }finally{
    sending--; updateBusy();
  }
}
function updateBusy(){
  if(recording){
    setStatus((sending>0?'<span class="spin"></span>':"")+"Ag éisteacht…", false, true);
  }else if(sending>0){
    setStatus('<span class="spin"></span>Ag próiseáil…');
  }else if(!statusEl.classList.contains("err")){
    setStatus("");
  }
}

function flushChunk(){
  if(!bufSamples) return;
  const all=new Float32Array(bufSamples);
  let o=0; for(const b of buf){ all.set(b,o); o+=b.length; }
  buf=[]; bufSamples=0;
  const spoke=hadSpeech;
  hadSpeech=false; chunkStartedAt=performance.now();
  if(spoke) sendChunk(all, srcRate);
}

async function startDictation(){
  if(recording) return;
  // the AudioContext must be built inside the tap that triggered this,
  // otherwise iOS treats it as un-gestured and leaves it suspended
  const AC = window.AudioContext || window.webkitAudioContext;
  if(!audioCtx || audioCtx.state === "closed") audioCtx = new AC();
  if(audioCtx.state === "suspended") audioCtx.resume();
  try{
    stream = await navigator.mediaDevices.getUserMedia({audio:{
      echoCancellation:true, noiseSuppression:true
    }});
  }catch(e){
    setStatus("Ní bhfuair an aip cead micreafóin. Ceadaigh é i Socruithe &gt; Safari.", true);
    try{ if(audioCtx) audioCtx.close(); }catch(err){}
    audioCtx = null;
    return;
  }
  await audioCtx.resume();
  srcRate = audioCtx.sampleRate;
  sourceNode = audioCtx.createMediaStreamSource(stream);
  procNode = audioCtx.createScriptProcessor(4096,1,1);
  sourceNode.connect(procNode);
  procNode.connect(audioCtx.destination);

  buf=[]; bufSamples=0; hadSpeech=false;
  chunkStartedAt=performance.now(); lastSpeechAt=0;
  recording=true;
  micBtn.classList.add("rec");
  hint.textContent="Labhair go nádúrtha · seolfar gach abairt uaithi féin";
  updateBusy();

  procNode.onaudioprocess = (ev)=>{
    if(!recording) return;
    const inp = ev.inputBuffer.getChannelData(0);
    buf.push(new Float32Array(inp));
    bufSamples += inp.length;

    let sum=0;
    for(let i=0;i<inp.length;i+=8) sum += inp[i]*inp[i];
    const rms = Math.sqrt(sum/(inp.length/8));
    const now = performance.now();
    if(rms > RMS_SPEECH){ hadSpeech=true; lastSpeechAt=now; }

    // signature ring: breathes with the voice
    const lvl = Math.min(1, rms*14);
    ring.style.opacity = 0.25 + lvl*0.75;
    ring.style.transform = "scale("+(1+lvl*0.28)+")";

    const dur = (now - chunkStartedAt)/1000;
    if((hadSpeech && lastSpeechAt && now-lastSpeechAt > SILENCE_HOLD_MS) || dur > MAX_CHUNK_SECONDS){
      flushChunk();
    }
  };
}

function stopDictation(){
  if(!recording) return;
  recording=false;
  flushChunk();
  try{ procNode && procNode.disconnect(); sourceNode && sourceNode.disconnect(); }catch(e){}
  try{ stream && stream.getTracks().forEach(t=>t.stop()); }catch(e){}
  try{ audioCtx && audioCtx.close(); }catch(e){}
  procNode=sourceNode=stream=audioCtx=null;
  micBtn.classList.remove("rec");
  ring.style.opacity=0;
  hint.textContent="Brúigh chun tosú · brúigh arís chun stopadh";
  updateBusy();
}

micBtn.onclick = ()=>{ recording ? stopDictation() : startDictation(); };

/* ---------------- init ---------------- */
renderList();
})();
</script>
</body>
</html>
